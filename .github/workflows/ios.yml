# .github/workflows/ios.yml
#
# CE QUE FAIT CE FLUX
#   Il génère le projet Xcode, le COMPILE, joue les tests, puis produit un IPA
#   NON SIGNÉ (installable via AltStore, Sideloadly, TrollStore… — pas via
#   l'App Store, qui exige une signature Apple).
#
# POURQUOI CE FLUX EXISTE
#   Le dépôt a été écrit sans Mac. Rien ne prouve qu'un code Swift compile tant
#   qu'un compilateur Swift ne l'a pas vu. Ce flux est donc la seule preuve
#   réelle : il compile pour de bon, à chaque poussée.
#
# RUNNER macOS SUR UN DÉPÔT PUBLIC
#   Les minutes de runner macOS sont gratuites pour les dépôts publics. Si le
#   dépôt repasse en privé, ce flux consomme le quota macOS (×10 par rapport à
#   Linux) — à garder en tête.
#
# SECRETS
#   Les deux secrets ci-dessous sont FACULTATIFS : sans eux, la compilation
#   passe quand même (Config/Base.xcconfig prévoit des valeurs vides), et
#   l'application affiche un écran expliquant ce qui manque.
#   Ne jamais mettre la clé `service_role` ici — seulement la clé publiable.

name: iOS — compilation, tests et IPA non signé

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
#  Droits du jeton, réduits au strict nécessaire.
#  Ce flux LIT le dépôt et publie un artefact : il n'écrit jamais dedans. Sans
#  ce bloc, le jeton reçoit les droits par défaut, plus larges que nécessaire.
#
#  À noter, car c'est le piège : un `permissions` de travail REMPLACE celui-ci,
#  il ne s'y ajoute pas. Le jour où une étape fera un `gh release create`, il
#  faudra `contents: write` sur le travail concerné — sinon l'étape échouera à
#  la toute fin, après une compilation de quinze minutes. Le contrôle
#  `scripts/verifier-flux.mjs` refuse précisément cette combinaison.
# ─────────────────────────────────────────────────────────────────────────────
permissions:
  contents: read

jobs:
  build:
    name: Compiler, tester, empaqueter
    runs-on: macos-15
    timeout-minutes: 60

    env:
      SCHEME: Swiftdeepseek
      PROJECT: Swiftdeepseek.xcodeproj
      BUNDLE_ID: fr.swiftdeepseek.app

    steps:
      # ───────────────────────────────────────────────────────────────────────
      #  POURQUOI CES VERSIONS D'ACTIONS, ET PAS v4
      #  Une annotation publique du run a signalé :
      #    « Node.js 20 is deprecated. The following actions target Node.js 20
      #      but are being forced to run on Node.js 24 : actions/checkout@v4,
      #      actions/upload-artifact@v4. »
      #  Être épinglé ne suffit donc pas : on peut être épinglé à une version
      #  dépréciée. Les cibles ci-dessous sont les plus PETITES qui déclarent
      #  `runs.using: node24` — mesuré en lisant `action.yml` à chaque étiquette :
      #    checkout        v4 = node20 | v5 = node24   <- v5 suffit
      #    upload-artifact v4 = node20 | v5 = node20 (!) | v6 = node24  <- v6
      #  Piège : monter `upload-artifact` de v4 à v5 NE corrige PAS
      #  l'avertissement, v5 déclare encore node20.
      #  upload-artifact v6 n'apporte qu'un changement de moteur (Node 24) et
      #  exige un exécuteur >= 2.327.1 ; `macos-15` hébergé le dépasse. Aucune
      #  rupture d'API : les entrées `name` / `path` sont inchangées.
      # ───────────────────────────────────────────────────────────────────────
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      # ───────────────────────────────────────────────────────────────────────
      #  Garde-fou : ce flux ne doit jamais s'exécuter dans le dépôt React
      #  Native. Le dépôt de référence est en LECTURE SEULE.
      # ───────────────────────────────────────────────────────────────────────
      - name: Vérifier le dépôt cible
        run: |
          set -euo pipefail
          echo "Dépôt en cours : $GITHUB_REPOSITORY"
          if [ "$GITHUB_REPOSITORY" != "Msoumaya2019/Swiftdeepseek" ]; then
            echo "::error::Ce flux ne doit s'exécuter que dans Msoumaya2019/Swiftdeepseek (dépôt en écriture). Dépôt vu : $GITHUB_REPOSITORY"
            exit 1
          fi

      # ───────────────────────────────────────────────────────────────────────
      #  Contrôle statique des flux, AVANT les étapes longues.
      #  Il coûte une seconde ; la compilation qui suit en coûte quinze. Un
      #  `run:` invalide ou une action non épinglée se voit donc ici, et non
      #  après l'installation de XcodeGen.
      #  Aucune dépendance : Node est déjà présent sur les exécuteurs GitHub.
      # ───────────────────────────────────────────────────────────────────────
      - name: Vérifier les flux de travail
        run: node scripts/verifier-flux.mjs

      - name: Version de Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Installer XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      # ───────────────────────────────────────────────────────────────────────
      #  Configuration Supabase (facultative).
      #  Les deux secrets sont NON secrets par nature (clé publiable), mais on
      #  les garde hors du dépôt pour que le dépôt reste vierge de toute valeur
      #  d'environnement.
      #  `SLASH` contourne le fait que « // » commence un commentaire dans un
      #  xcconfig — sans lui, l'URL deviendrait « https: ».
      # ───────────────────────────────────────────────────────────────────────
      - name: Écrire Config/Secrets.xcconfig
        env:
          SUPABASE_URL_VALUE: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY_VALUE: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL_VALUE:-}" ] || [ -z "${SUPABASE_KEY_VALUE:-}" ]; then
            echo "::warning::SUPABASE_URL ou SUPABASE_ANON_KEY absent. La compilation continue ; l'application affichera un écran de configuration."
            exit 0
          fi
          {
            echo "SUPABASE_URL = ${SUPABASE_URL_VALUE//\//\$(SLASH)}"
            echo "SUPABASE_ANON_KEY = ${SUPABASE_KEY_VALUE}"
          } > Config/Secrets.xcconfig
          echo "Config/Secrets.xcconfig écrit ($(wc -c < Config/Secrets.xcconfig) octets)."

      - name: Générer le projet Xcode
        run: xcodegen generate --spec project.yml

      # ───────────────────────────────────────────────────────────────────────
      #  GARDE-FOU : LA CONFIGURATION ATTEINT-ELLE VRAIMENT LA COMPILATION ?
      #
      #  POURQUOI CE PAS EXISTE
      #  Mesuré sur un artefact réel : `Config/Secrets.xcconfig` faisait 137
      #  octets et contenait bien l'URL, et pourtant l'`Info.plist` de
      #  l'application construite portait `SUPABASE_URL = ''`. Cause : dans
      #  `Base.xcconfig`, les deux valeurs de repli vides étaient écrites APRÈS
      #  le `#include?`, et dans un xcconfig la DERNIÈRE affectation gagne.
      #
      #  Ce défaut était invisible, et il désactivait ses propres garde-fous :
      #  les deux tests qui vérifient la configuration se SAUTENT quand elle
      #  paraît absente — donc ils se sautaient, et le run restait vert.
      #
      #  Ce pas rend le cas bruyant : si le secret est posé et que la variable
      #  de compilation ressort vide, le run échoue au lieu de se taire. On
      #  n'imprime pas la valeur — GitHub la masquerait de toute façon — sa
      #  longueur suffit à décider.
      # ───────────────────────────────────────────────────────────────────────
      - name: Vérifier que la configuration Supabase atteint la compilation
        env:
          ATTENDU: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${ATTENDU:-}" ]; then
            echo "Secret SUPABASE_URL absent : rien à vérifier, c'est un état supporté."
            exit 0
          fi
          VU=$(xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
                 -showBuildSettings 2>/dev/null \
               | sed -n 's/^[[:space:]]*SUPABASE_URL[[:space:]]*=[[:space:]]*//p' | head -1)
          echo "SUPABASE_URL résolu par la compilation : ${#VU} caractère(s)."
          if [ -z "$VU" ]; then
            echo "::error::Le secret SUPABASE_URL est posé, mais la variable de compilation est VIDE : Config/Secrets.xcconfig n'atteint pas la compilation. Vérifier l'ORDRE des lignes dans Config/Base.xcconfig — les replis vides doivent précéder le #include?."
            exit 1
          fi
          echo "La configuration Supabase atteint bien la compilation."

      # ───────────────────────────────────────────────────────────────────────
      #  Compilation.
      #
      #  POURQUOI `set +e` — ET PAS SEULEMENT UN COMMENTAIRE
      #  Le shell par défaut d'un `run:` est `bash -e`. Avec `-e`, l'échec de
      #  xcodebuild TERMINE le script immédiatement : `code=$?` n'est jamais
      #  atteint, et le bloc qui réémet les erreurs ne s'exécute pas.
      #  Mesuré : la première version de ce pas annonçait en commentaire
      #  « l'échec est capturé », mais ne désactivait pas `-e` — aucune
      #  annotation n'a été produite, et seul « exit code 65 » est apparu.
      #
      #  POURQUOI LES ERREURS SONT RÉÉMISES EN ANNOTATIONS
      #  Le journal complet exige une authentification pour être téléchargé
      #  (HTTP 403 sans jeton). Les annotations de contrôle, elles, se lisent
      #  publiquement. Un échec devient donc diagnosticable sans avoir à ouvrir
      #  la page Actions — ce qui compte quand on écrit le code sans Mac.
      # ───────────────────────────────────────────────────────────────────────
      - name: Compiler (simulateur)
        run: |
          set +e
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            > build-simulator.log 2>&1
          code=$?
          tail -40 build-simulator.log
          if [ "$code" -ne 0 ]; then
            echo "::error::Compilation échouée (code $code). Erreurs du compilateur :"
            grep -E -A 4 'error:' build-simulator.log | head -60 | sed 's/%/%25/g' | while IFS= read -r ligne; do
              echo "::error::$ligne"
            done
            exit "$code"
          fi
          echo "Compilation réussie."

      # ───────────────────────────────────────────────────────────────────────
      #  Tests — même traitement que la compilation, et pour la même raison.
      #
      #  `xcodebuild test` échoue aussi bien sur une assertion que sur une
      #  erreur de compilation de la cible de tests : sans extraire le journal,
      #  on ne sait pas laquelle des deux. Le code de sortie est donc capturé,
      #  puis les lignes utiles sont réémises en annotations.
      # ───────────────────────────────────────────────────────────────────────
      - name: Jouer les tests
        run: |
          # ───────────────────────────────────────────────────────────────────
          #  POURQUOI LE SIMULATEUR EST RÉSOLU À L'EXÉCUTION
          #  Nommer l'appareil (`name=iPhone 16`) paraît stable et ne l'est pas :
          #  le contenu de l'image d'exécuteur change sans préavis. Mesuré ici —
          #  trois runs verts d'affilée avec `name=iPhone 16`, puis le run #11 a
          #  échoué en code 70 :
          #    xcodebuild: error: Unable to find a device matching the provided
          #    destination specifier:
          #  Le même fichier, au même commit près, passait la veille. On demande
          #  donc à `simctl` un appareil RÉELLEMENT disponible, et on le nomme
          #  par son identifiant (`id=`), qui ne dépend pas du catalogue.
          # ───────────────────────────────────────────────────────────────────
          DEVICE=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          if [ -z "$DEVICE" ]; then
            echo "::error::Aucun simulateur iPhone disponible. Appareils vus :"
            xcrun simctl list devices available 2>&1 | sed 's/%/%25/g' | head -40 | while IFS= read -r l; do
              echo "::error::$l"
            done
            exit 1
          fi
          echo "Simulateur retenu : $DEVICE"
          xcrun simctl list devices available | grep -F "$DEVICE" || true

          set +e
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            > build-tests.log 2>&1
          code=$?
          tail -60 build-tests.log
          if [ "$code" -ne 0 ]; then
            echo "::error::Tests échoués (code $code). Lignes utiles :"
            #  `-A 6` : la ligne d'erreur seule ne suffit pas. Pour une
            #  destination introuvable, `xcodebuild` écrit la liste des
            #  appareils qu'il a vus sur les lignes SUIVANTES — sans elles, le
            #  run #11 n'annonçait qu'un message tronqué se terminant par « : ».
            grep -E -A 6 'error:|Failing tests|XCTAssert|failed \(|TEST FAILED|Testing failed' build-tests.log \
              | head -60 | sed 's/%/%25/g' | while IFS= read -r ligne; do
              echo "::error::$ligne"
            done
            exit "$code"
          fi
          echo "Tests réussis."

      # ───────────────────────────────────────────────────────────────────────
      #  Archive NON SIGNÉE puis ré-empaquetage manuel en .ipa.
      #  `xcodebuild -exportArchive` refuse de produire un IPA sans signature :
      #  on reconstruit donc l'archive nous-mêmes, ce qui est exactement ce que
      #  fait `-exportArchive` en interne.
      # ───────────────────────────────────────────────────────────────────────
      - name: Archive non signée
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Swiftdeepseek.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee build-archive.log | tail -40

      - name: Empaqueter l'IPA
        run: |
          set -euo pipefail
          APP="build/Swiftdeepseek.xcarchive/Products/Applications/Swiftdeepseek.app"
          test -d "$APP" || { echo "::error::Application introuvable dans l'archive."; exit 1; }
          rm -rf build/Payload build/Swiftdeepseek-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          # Vérification : la ressource coranique doit être DANS le paquet. Un
          # paquet sans ses données se lance et se ferme aussitôt.
          test -f "build/Payload/Swiftdeepseek.app/verses.json" \
            || { echo "::error::verses.json absent du paquet : les ressources ne sont pas embarquées."; exit 1; }
          test -d "build/Payload/Swiftdeepseek.app/Mushaf" \
            || { echo "::error::Dossier Mushaf absent du paquet : les pages ne sont pas embarquées."; exit 1; }
          echo "Pages embarquées : $(ls build/Payload/Swiftdeepseek.app/Mushaf | wc -l)"
          (cd build && zip -qry Swiftdeepseek-unsigned.ipa Payload)
          ls -lh build/Swiftdeepseek-unsigned.ipa

      - name: Publier les artefacts
        uses: actions/upload-artifact@v6
        with:
          name: Swiftdeepseek-unsigned-ipa
          path: |
            build/Swiftdeepseek-unsigned.ipa
            build-simulator.log
            build-tests.log
            build-archive.log
          if-no-files-found: error
          retention-days: 30
